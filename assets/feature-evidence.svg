<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="evidence-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="280" rx="12" fill="url(#evidence-bg)"/>

  <!-- Source 1: Satellite -->
  <rect x="20" y="25" width="170" height="80" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <rect x="20" y="25" width="170" height="24" rx="8" fill="#3b82f6" opacity="0.1"/>
  <text x="35" y="41" fill="#3b82f6" font-family="system-ui" font-size="9" font-weight="600">&#x1F6F0; SATELLITE SAR</text>
  <rect x="30" y="58" width="60" height="8" rx="2" fill="#22c55e" opacity="0.3"/>
  <text x="35" y="65" fill="#22c55e" font-family="monospace" font-size="7">VERIFIED</text>
  <text x="30" y="82" fill="#64748b" font-family="monospace" font-size="7">Sentinel-2 | 10m res</text>
  <text x="30" y="94" fill="#475569" font-family="monospace" font-size="6">Last scan: 12 min ago</text>

  <!-- Source 2: Weather Radar -->
  <rect x="210" y="25" width="170" height="80" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
  <rect x="210" y="25" width="170" height="24" rx="8" fill="#0ea5e9" opacity="0.1"/>
  <text x="225" y="41" fill="#0ea5e9" font-family="system-ui" font-size="9" font-weight="600">&#x1F327; WEATHER RADAR</text>
  <rect x="220" y="58" width="60" height="8" rx="2" fill="#22c55e" opacity="0.3"/>
  <text x="225" y="65" fill="#22c55e" font-family="monospace" font-size="7">VERIFIED</text>
  <text x="220" y="82" fill="#64748b" font-family="monospace" font-size="7">OpenWeather | 5km res</text>
  <text x="220" y="94" fill="#475569" font-family="monospace" font-size="6">Last scan: 5 min ago</text>

  <!-- Source 3: Government -->
  <rect x="20" y="115" width="170" height="80" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <rect x="20" y="115" width="170" height="24" rx="8" fill="#f59e0b" opacity="0.1"/>
  <text x="35" y="131" fill="#f59e0b" font-family="system-ui" font-size="9" font-weight="600">&#x1F3DB; GOV BULLETINS</text>
  <rect x="30" y="148" width="60" height="8" rx="2" fill="#f59e0b" opacity="0.3"/>
  <text x="35" y="155" fill="#f59e0b" font-family="monospace" font-size="7">PARTIAL</text>
  <text x="30" y="172" fill="#64748b" font-family="monospace" font-size="7">NDMA | TNSDMA feeds</text>
  <text x="30" y="184" fill="#475569" font-family="monospace" font-size="6">Last update: 1h ago</text>

  <!-- Source 4: IoT Sensors -->
  <rect x="210" y="115" width="170" height="80" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
  <rect x="210" y="115" width="170" height="24" rx="8" fill="#8b5cf6" opacity="0.1"/>
  <text x="225" y="131" fill="#8b5cf6" font-family="system-ui" font-size="9" font-weight="600">&#x1F4E1; IoT SENSORS</text>
  <rect x="220" y="148" width="60" height="8" rx="2" fill="#22c55e" opacity="0.3"/>
  <text x="225" y="155" fill="#22c55e" font-family="monospace" font-size="7">VERIFIED</text>
  <text x="220" y="172" fill="#64748b" font-family="monospace" font-size="7">Water level | Flow sensors</text>
  <text x="220" y="184" fill="#475569" font-family="monospace" font-size="6">Last ping: 30s ago</text>

  <!-- Cross-verification badge -->
  <rect x="100" y="210" width="200" height="30" rx="8" fill="#22c55e" opacity="0.1" stroke="#22c55e" stroke-width="1"/>
  <text x="200" y="230" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="10" font-weight="600">&#x2705; 3/4 Sources Cross-Verified</text>

  <!-- Confidence meter -->
  <text x="30" y="260" fill="#64748b" font-family="system-ui" font-size="8">CONFIDENCE:</text>
  <rect x="110" y="252" width="200" height="8" rx="4" fill="#334155"/>
  <rect x="110" y="252" width="160" height="8" rx="4" fill="#22c55e" opacity="0.7"/>
  <text x="320" y="260" fill="#22c55e" font-family="system-ui" font-size="8" font-weight="bold">82%</text>

  <!-- Label -->
  <text x="200" y="278" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">MULTI-SOURCE EVIDENCE INSPECTOR</text>
</svg>
