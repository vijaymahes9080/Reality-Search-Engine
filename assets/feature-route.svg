<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="route-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="280" rx="12" fill="url(#route-bg)"/>

  <!-- Map background grid -->
  <g opacity="0.08" stroke="#3b82f6" stroke-width="0.3">
    <line x1="50" y1="40" x2="50" y2="210"/>
    <line x1="100" y1="40" x2="100" y2="210"/>
    <line x1="150" y1="40" x2="150" y2="210"/>
    <line x1="200" y1="40" x2="200" y2="210"/>
    <line x1="250" y1="40" x2="250" y2="210"/>
    <line x1="300" y1="40" x2="300" y2="210"/>
    <line x1="350" y1="40" x2="350" y2="210"/>
    <line x1="50" y1="60" x2="350" y2="60"/>
    <line x1="50" y1="90" x2="350" y2="90"/>
    <line x1="50" y1="120" x2="350" y2="120"/>
    <line x1="50" y1="150" x2="350" y2="150"/>
    <line x1="50" y1="180" x2="350" y2="180"/>
    <line x1="50" y1="210" x2="350" y2="210"/>
  </g>

  <!-- Flood zones -->
  <ellipse cx="150" cy="110" rx="45" ry="30" fill="#3b82f6" opacity="0.12" stroke="#3b82f6" stroke-width="0.5" opacity="0.2"/>
  <ellipse cx="280" cy="140" rx="35" ry="25" fill="#3b82f6" opacity="0.12" stroke="#3b82f6" stroke-width="0.5" opacity="0.2"/>

  <!-- Blocked roads -->
  <line x1="100" y1="90" x2="200" y2="90" stroke="#ef4444" stroke-width="3" opacity="0.4" stroke-dasharray="6,4"/>
  <line x1="230" y1="130" x2="310" y2="130" stroke="#ef4444" stroke-width="3" opacity="0.4" stroke-dasharray="6,4"/>

  <!-- Safe evacuation route -->
  <path d="M80,180 L120,180 L120,150 L180,150 L180,80 L250,80 L250,60 L320,60" 
        fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" values="0,500;500,0" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Route waypoints -->
  <circle cx="80" cy="180" r="6" fill="#3b82f6" stroke="white" stroke-width="2"/>
  <text x="80" y="198" text-anchor="middle" fill="#3b82f6" font-family="system-ui" font-size="8" font-weight="bold">START</text>

  <circle cx="320" cy="60" r="6" fill="#22c55e" stroke="white" stroke-width="2"/>
  <text x="320" y="50" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="8" font-weight="bold">SAFE ZONE</text>

  <!-- Direction arrows on route -->
  <polygon points="120,165 125,158 130,165" fill="#22c55e" opacity="0.8"/>
  <polygon points="165,150 172,145 165,140" fill="#22c55e" opacity="0.8"/>
  <polygon points="195,80 202,75 195,70" fill="#22c55e" opacity="0.8"/>
  <polygon points="235,60 242,55 235,50" fill="#22c55e" opacity="0.8"/>

  <!-- Info panel -->
  <rect x="230" y="165" width="130" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.9"/>
  <text x="245" y="182" fill="#22c55e" font-family="system-ui" font-size="9" font-weight="600">&#x1F697; 68.5 km</text>
  <text x="245" y="198" fill="#94a3b8" font-family="system-ui" font-size="9">&#x23F1; ETA: 1h 14m</text>

  <!-- Distance marker -->
  <text x="150" y="145" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="8" font-weight="bold">&#x26D4; BLOCKED</text>

  <!-- Label -->
  <text x="200" y="250" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">EVACUATION ROUTE OPTIMIZER</text>
  <text x="200" y="270" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Autonomous Flood-Free Navigation</text>
</svg>
