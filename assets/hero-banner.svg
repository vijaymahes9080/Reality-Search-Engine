<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="url(#bg)"/>

  <!-- Decorative blobs -->
  <circle cx="150" cy="100" r="120" fill="#3b82f6" opacity="0.08" filter="url(#blur1)"/>
  <circle cx="750" cy="300" r="150" fill="#8b5cf6" opacity="0.08" filter="url(#blur1)"/>
  <circle cx="450" cy="200" r="80" fill="#06b6d4" opacity="0.05" filter="url(#blur2)"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#3b82f6" stroke-width="0.5" fill="none">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="350" x2="900" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
  </g>

  <!-- Globe icon -->
  <circle cx="450" cy="175" r="70" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  <ellipse cx="450" cy="175" rx="70" ry="30" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="450" cy="175" rx="30" ry="70" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
  <line x1="380" y1="175" x2="520" y2="175" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="105" x2="450" y2="245" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>

  <!-- Data points on globe -->
  <circle cx="430" cy="155" r="4" fill="#ef4444" opacity="0.9">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="470" cy="185" r="4" fill="#22c55e" opacity="0.9">
    <animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="445" cy="195" r="4" fill="#f59e0b" opacity="0.9">
    <animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="460" cy="155" r="4" fill="#8b5cf6" opacity="0.9">
    <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Connection lines from globe -->
  <line x1="380" y1="155" x2="200" y2="120" stroke="#3b82f6" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="520" y1="185" x2="700" y2="150" stroke="#8b5cf6" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="450" y1="245" x2="450" y2="310" stroke="#06b6d4" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>

  <!-- Side icons -->
  <g transform="translate(170,100)" opacity="0.7">
    <rect x="-25" y="-25" width="50" height="50" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#3b82f6" font-size="22">&#x1F5FA;</text>
  </g>
  <g transform="translate(730,130)" opacity="0.7">
    <rect x="-25" y="-25" width="50" height="50" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#8b5cf6" font-size="22">&#x1F4CA;</text>
  </g>
  <g transform="translate(350,310)" opacity="0.7">
    <rect x="-25" y="-25" width="50" height="50" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#22c55e" font-size="22">&#x1F9ED;</text>
  </g>
  <g transform="translate(550,310)" opacity="0.7">
    <rect x="-25" y="-25" width="50" height="50" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#f59e0b" font-size="22">&#x1F4A1;</text>
  </g>

  <!-- Title text -->
  <text x="450" y="65" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="300" letter-spacing="8" opacity="0.6">AI-POWERED GEOSPATIAL INTELLIGENCE</text>

  <!-- Bottom accent line -->
  <rect x="200" y="370" width="500" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>
</svg>
