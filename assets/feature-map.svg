<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="map-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="280" rx="12" fill="url(#map-bg)"/>

  <!-- Map tile simulation -->
  <g opacity="0.15">
    <rect x="30" y="30" width="340" height="180" rx="4" fill="none" stroke="#3b82f6" stroke-width="0.5"/>
    <!-- Roads -->
    <line x1="50" y1="80" x2="350" y2="80" stroke="#475569" stroke-width="2"/>
    <line x1="50" y1="130" x2="350" y2="130" stroke="#475569" stroke-width="2"/>
    <line x1="120" y1="30" x2="120" y2="210" stroke="#475569" stroke-width="2"/>
    <line x1="200" y1="30" x2="200" y2="210" stroke="#475569" stroke-width="2"/>
    <line x1="280" y1="30" x2="280" y2="210" stroke="#475569" stroke-width="2"/>
    <!-- River -->
    <path d="M30,100 Q100,90 150,110 Q200,130 250,105 Q300,80 370,95" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- Flood zone -->
  <ellipse cx="200" cy="120" rx="80" ry="50" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Markers -->
  <g>
    <circle cx="130" cy="90" r="8" fill="#ef4444" opacity="0.8">
      <animate attributeName="r" values="8;11;8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="90" r="16" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.2">
      <animate attributeName="r" values="16;24;16" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="130" y="78" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="8" font-weight="bold">HIGH RISK</text>
  </g>

  <g>
    <circle cx="250" cy="100" r="8" fill="#f59e0b" opacity="0.8">
      <animate attributeName="r" values="8;10;8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="250" y="88" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="8" font-weight="bold">AFFECTED</text>
  </g>

  <g>
    <circle cx="300" cy="150" r="8" fill="#22c55e" opacity="0.8"/>
    <text x="300" y="138" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="8" font-weight="bold">SAFE</text>
  </g>

  <g>
    <circle cx="170" cy="150" r="8" fill="#8b5cf6" opacity="0.8">
      <animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="170" y="168" text-anchor="middle" fill="#8b5cf6" font-family="system-ui" font-size="8" font-weight="bold">PREDICTED</text>
  </g>

  <!-- Layer toggle icons -->
  <g transform="translate(350, 45)" opacity="0.7">
    <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#3b82f6" font-size="12">&#x1F5FA;</text>
  </g>
  <g transform="translate(350, 75)" opacity="0.7">
    <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#1e293b" stroke="#0ea5e9" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#0ea5e9" font-size="12">&#x1F327;</text>
  </g>
  <g transform="translate(350, 105)" opacity="0.7">
    <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#22c55e" font-size="12">&#x1F3E1;</text>
  </g>

  <!-- Label -->
  <text x="200" y="245" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">GIS INTERACTIVE MAP</text>
  <text x="200" y="265" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Leaflet 1.9 | Dark Tiles | Layer Controls</text>
</svg>
