<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="sim-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="slider-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="70%" style="stop-color:#3b82f6"/>
      <stop offset="70%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <linearGradient id="slider-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="45%" style="stop-color:#f59e0b"/>
      <stop offset="45%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <linearGradient id="slider-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="85%" style="stop-color:#ef4444"/>
      <stop offset="85%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
  </defs>

  <rect width="400" height="280" rx="12" fill="url(#sim-bg)"/>

  <!-- Panel background -->
  <rect x="30" y="25" width="340" height="195" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Header -->
  <rect x="30" y="25" width="340" height="35" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="50" y="47" fill="#f59e0b" font-family="system-ui" font-size="11" font-weight="600">&#x2699; DISASTER SIMULATION SANDBOX</text>

  <!-- Slider 1: Rainfall -->
  <text x="50" y="85" fill="#94a3b8" font-family="system-ui" font-size="10">Rainfall Intensity</text>
  <text x="320" y="85" fill="#3b82f6" font-family="system-ui" font-size="10" font-weight="bold">210 mm/h</text>
  <rect x="50" y="92" width="300" height="6" rx="3" fill="#334155"/>
  <rect x="50" y="92" width="210" height="6" rx="3" fill="url(#slider-1)"/>
  <circle cx="260" cy="95" r="8" fill="#3b82f6" stroke="#0f172a" stroke-width="2"/>

  <!-- Slider 2: Dam Discharge -->
  <text x="50" y="125" fill="#94a3b8" font-family="system-ui" font-size="10">Dam Discharge Outflow</text>
  <text x="310" y="125" fill="#f59e0b" font-family="system-ui" font-size="10" font-weight="bold">27,000 cusecs</text>
  <rect x="50" y="132" width="300" height="6" rx="3" fill="#334155"/>
  <rect x="50" y="132" width="135" height="6" rx="3" fill="url(#slider-2)"/>
  <circle cx="185" cy="135" r="8" fill="#f59e0b" stroke="#0f172a" stroke-width="2"/>

  <!-- Slider 3: Tidal Surge -->
  <text x="50" y="165" fill="#94a3b8" font-family="system-ui" font-size="10">Tidal Surge Elevation</text>
  <text x="320" y="165" fill="#ef4444" font-family="system-ui" font-size="10" font-weight="bold">3.4m</text>
  <rect x="50" y="172" width="300" height="6" rx="3" fill="#334155"/>
  <rect x="50" y="172" width="255" height="6" rx="3" fill="url(#slider-3)"/>
  <circle cx="305" cy="175" r="8" fill="#ef4444" stroke="#0f172a" stroke-width="2"/>

  <!-- Severity meter -->
  <rect x="50" y="195" width="300" height="18" rx="4" fill="#0f172a"/>
  <text x="60" y="208" fill="#64748b" font-family="system-ui" font-size="8">SEVERITY</text>
  <rect x="120" y="198" width="50" height="12" rx="2" fill="#22c55e"/>
  <rect x="175" y="198" width="50" height="12" rx="2" fill="#f59e0b"/>
  <rect x="230" y="198" width="70" height="12" rx="2" fill="#ef4444"/>
  <rect x="305" y="198" width="40" height="12" rx="2" fill="#dc2626"/>
  <!-- Severity indicator -->
  <polygon points="285,195 290,190 295,195" fill="white"/>

  <!-- Label -->
  <text x="200" y="250" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">DISASTER SIMULATION SANDBOX</text>
  <text x="200" y="270" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Real-time Climate Parameter Control</text>
</svg>
