<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="voice-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="280" rx="12" fill="url(#voice-bg)"/>

  <!-- Sound waves -->
  <g transform="translate(200, 100)">
    <circle r="20" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.8"/>
    <circle r="35" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="35;50;35" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="50" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="50;70;50" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="65" fill="none" stroke="#8b5cf6" stroke-width="0.5" opacity="0.2">
      <animate attributeName="r" values="65;85;65" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Microphone icon -->
    <rect x="-8" y="-15" width="16" height="22" rx="8" fill="#8b5cf6"/>
    <path d="M-15,5 Q-15,18 0,18 Q15,18 15,5" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="0" y1="18" x2="0" y2="25" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="-8" y1="25" x2="8" y2="25" stroke="#8b5cf6" stroke-width="2"/>
  </g>

  <!-- Audio bars -->
  <g transform="translate(120, 180)">
    <rect x="0" y="-15" width="4" height="30" rx="2" fill="#8b5cf6" opacity="0.6">
      <animate attributeName="height" values="30;10;30" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-15;-5;-15" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="-25" width="4" height="50" rx="2" fill="#8b5cf6" opacity="0.7">
      <animate attributeName="height" values="50;15;50" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-25;-7;-25" dur="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="-10" width="4" height="20" rx="2" fill="#8b5cf6" opacity="0.5">
      <animate attributeName="height" values="20;8;20" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-10;-4;-10" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="30" y="-30" width="4" height="60" rx="2" fill="#8b5cf6" opacity="0.8">
      <animate attributeName="height" values="60;20;60" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-30;-10;-30" dur="0.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="-18" width="4" height="36" rx="2" fill="#8b5cf6" opacity="0.6">
      <animate attributeName="height" values="36;12;36" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-18;-6;-18" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="50" y="-22" width="4" height="44" rx="2" fill="#8b5cf6" opacity="0.7">
      <animate attributeName="height" values="44;14;44" dur="0.75s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-22;-7;-22" dur="0.75s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="-12" width="4" height="24" rx="2" fill="#8b5cf6" opacity="0.5">
      <animate attributeName="height" values="24;8;24" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-12;-4;-12" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="-28" width="4" height="56" rx="2" fill="#8b5cf6" opacity="0.75">
      <animate attributeName="height" values="56;18;56" dur="0.65s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-28;-9;-28" dur="0.65s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="-16" width="4" height="32" rx="2" fill="#8b5cf6" opacity="0.55">
      <animate attributeName="height" values="32;10;32" dur="0.95s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-16;-5;-16" dur="0.95s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="-20" width="4" height="40" rx="2" fill="#8b5cf6" opacity="0.65">
      <animate attributeName="height" values="40;12;40" dur="0.85s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-20;-6;-20" dur="0.85s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Language toggle -->
  <g transform="translate(200, 215)">
    <rect x="-90" y="-14" width="60" height="28" rx="14" fill="#3b82f6"/>
    <text x="-60" y="4" text-anchor="middle" fill="white" font-family="system-ui" font-size="10" font-weight="600">EN</text>
    <rect x="30" y="-14" width="60" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="60" y="4" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10" font-weight="600">&#x0B85;&#x0B9A;&#x0BCD;&#x0BAE;&#x0BBF; </text>
  </g>

  <!-- TTS output text -->
  <rect x="50" y="240" width="300" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
  <text x="65" y="255" fill="#22c55e" font-family="monospace" font-size="8">&#x25B6; "Alert: 34 high-risk hospitals in Tamil Nadu..."</text>

  <!-- Label -->
  <text x="200" y="270" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">AI VOICE ASSISTANT</text>
</svg>
