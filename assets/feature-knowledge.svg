<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="kg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="280" rx="12" fill="url(#kg-bg)"/>

  <!-- Nodes -->
  <!-- Entity node -->
  <circle cx="200" cy="100" r="28" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="96" text-anchor="middle" fill="#3b82f6" font-family="system-ui" font-size="18">&#x1F3E5;</text>
  <text x="200" y="112" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="7">HOSPITAL</text>

  <!-- Event node -->
  <circle cx="100" cy="180" r="28" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="100" y="176" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="18">&#x1F30A;</text>
  <text x="100" y="192" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="7">FLOOD</text>

  <!-- Location node -->
  <circle cx="300" cy="180" r="28" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="300" y="176" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="18">&#x1F5FA;</text>
  <text x="300" y="192" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="7">LOCATION</text>

  <!-- Road node -->
  <circle cx="200" cy="210" r="28" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="206" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="18">&#x1F6E3;</text>
  <text x="200" y="222" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="7">ROAD</text>

  <!-- Time node -->
  <circle cx="140" cy="60" r="22" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="140" y="56" text-anchor="middle" fill="#8b5cf6" font-family="system-ui" font-size="14">&#x23F1;</text>
  <text x="140" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="6">TIME</text>

  <!-- Risk node -->
  <circle cx="260" cy="60" r="22" fill="#0f172a" stroke="#dc2626" stroke-width="1.5"/>
  <text x="260" y="56" text-anchor="middle" fill="#dc2626" font-family="system-ui" font-size="14">&#x26A0;</text>
  <text x="260" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="6">RISK</text>

  <!-- Edges -->
  <line x1="180" y1="120" x2="120" y2="160" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="220" y1="120" x2="280" y2="160" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="185" y1="125" x2="185" y2="185" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>
  <line x1="120" y1="180" x2="175" y2="200" stroke="#ef4444" stroke-width="1" opacity="0.3" stroke-dasharray="4,3"/>
  <line x1="280" y1="180" x2="225" y2="200" stroke="#22c55e" stroke-width="1" opacity="0.3" stroke-dasharray="4,3"/>
  <line x1="160" y1="75" x2="180" y2="90" stroke="#8b5cf6" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="240" y1="75" x2="220" y2="90" stroke="#dc2626" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>

  <!-- Edge labels -->
  <text x="140" y="145" fill="#64748b" font-family="system-ui" font-size="6" transform="rotate(-35, 140, 145)">AFFECTED_BY</text>
  <text x="260" y="145" fill="#64748b" font-family="system-ui" font-size="6" transform="rotate(35, 260, 145)">LOCATED_IN</text>
  <text x="188" y="160" fill="#64748b" font-family="system-ui" font-size="6">ACCESSIBLE_VIA</text>

  <!-- Label -->
  <text x="200" y="265" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">REALITY KNOWLEDGE GRAPH</text>
  <text x="200" y="278" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Entity-Event-Location Relationship Vectors</text>
</svg>
