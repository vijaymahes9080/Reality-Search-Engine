<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="globe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <radialGradient id="globe-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="280" rx="12" fill="url(#globe-bg)"/>

  <!-- Glow -->
  <circle cx="200" cy="130" r="90" fill="url(#globe-glow)"/>

  <!-- Globe -->
  <circle cx="200" cy="130" r="75" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.8"/>
  <circle cx="200" cy="130" r="75" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <ellipse cx="200" cy="130" rx="75" ry="35" fill="none" stroke="#3b82f6" stroke-width="1.2" opacity="0.5"/>
  <ellipse cx="200" cy="130" rx="40" ry="75" fill="none" stroke="#3b82f6" stroke-width="1.2" opacity="0.5"/>
  <ellipse cx="200" cy="130" rx="15" ry="75" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.3"/>

  <!-- Latitude lines -->
  <ellipse cx="200" cy="90" rx="65" ry="15" fill="none" stroke="#3b82f6" stroke-width="0.6" opacity="0.25"/>
  <ellipse cx="200" cy="170" rx="65" ry="15" fill="none" stroke="#3b82f6" stroke-width="0.6" opacity="0.25"/>

  <!-- Entity markers -->
  <g>
    <circle cx="175" cy="110" r="5" fill="#ef4444" opacity="0.9">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="175" cy="110" r="12" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="12;18;12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="230" cy="120" r="5" fill="#22c55e" opacity="0.9">
      <animate attributeName="r" values="5;7;5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="210" cy="155" r="5" fill="#f59e0b" opacity="0.9">
      <animate attributeName="r" values="5;7;5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="185" cy="145" r="5" fill="#8b5cf6" opacity="0.9">
      <animate attributeName="r" values="5;7;5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Satellite orbit -->
  <ellipse cx="200" cy="130" rx="100" ry="50" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.2" stroke-dasharray="4,6" transform="rotate(-20, 200, 130)"/>
  <circle cx="280" cy="95" r="3" fill="#f59e0b" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 200 130" to="360 200 130" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Label -->
  <text x="200" y="245" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">3D DIGITAL TWIN GLOBE</text>
  <text x="200" y="265" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Real-time Entity Projection &amp; Satellite Tracking</text>
</svg>
